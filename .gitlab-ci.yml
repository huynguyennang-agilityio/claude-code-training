# Lint and test the backend and the mobile app on every push.
stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  FLUTTER_VERSION: "3.47.7"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never

.backend:
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  before_script:
    - cd backend
    - pip install -r requirements-dev.txt

.mobile:
  image: debian:bookworm-slim
  cache:
    key: flutter-$FLUTTER_VERSION
    paths:
      - .cache/flutter
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl unzip xz-utils ca-certificates > /dev/null
    - |
      if [ ! -x .cache/flutter/bin/flutter ]; then
        git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git .cache/flutter
      fi
    - export PATH="$CI_PROJECT_DIR/.cache/flutter/bin:$PATH"
    - git config --global --add safe.directory "$CI_PROJECT_DIR/.cache/flutter"
    - flutter --version
    - cd mobile
    - flutter pub get

backend-lint:
  extends: .backend
  stage: lint
  script:
    - ruff check .
    - ruff format --check .

backend-test:
  extends: .backend
  stage: test
  script:
    - pytest

mobile-lint:
  extends: .mobile
  stage: lint
  script:
    - flutter analyze
    - dart format --output=none --set-exit-if-changed lib test

mobile-test:
  extends: .mobile
  stage: test
  script:
    - flutter test
