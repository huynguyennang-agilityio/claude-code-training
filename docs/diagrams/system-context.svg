        <title id="system-context-title">StrideQuest system context</title>
        <desc id="system-context-desc">Architecture diagram showing step data flowing from Apple Health or Health Connect into the Flutter app, which calls a FastAPI modular monolith backed by PostgreSQL, with medal images served from object storage.</desc>
