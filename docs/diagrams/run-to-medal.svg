<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="run-to-medal-title run-to-medal-desc" id="run-to-medal-root">
        <title id="run-to-medal-title">Run sync and medal award</title>
        <desc id="run-to-medal-desc">Sequence diagram of the core journey: the app syncs step samples, the runs module gets the challenge rule, rejects duplicate and out-of-window samples, stores the accepted ones and, when the target is reached, marks the run completed and returns the medal.</desc>
