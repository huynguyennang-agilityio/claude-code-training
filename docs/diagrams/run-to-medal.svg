      #run-to-medal-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #run-to-medal-root .diagram-container { width: 100%; overflow-x: auto; }
      #run-to-medal-root .diagram-container { overflow-x: visible; }</style>
