<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="request-flow-title request-flow-desc" id="request-flow-root">
        <title id="request-flow-title">Backend request flow</title>
        <desc id="request-flow-desc">Sequence diagram of one API request: the router validates input and calls the service, the service uses the repository and either raises a typed domain error returned as ErrorResponse or commits and returns the response schema.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #request-flow-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #request-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #request-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="request-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="request-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
