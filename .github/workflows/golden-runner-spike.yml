# Throwaway spike for #59 (plan 015, "Decision rule"). Never merged: its PR is closed.
# Runs the golden tests against the committed baselines on each candidate runner, twice.
# ubuntu-latest is the known failure, kept for the pixel numbers a revised plan would need.
name: golden-runner-spike

on:
  pull_request:

permissions:
  contents: read

jobs:
  goldens:
    name: goldens (${{ matrix.runner }}, run ${{ matrix.attempt }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15, ubuntu-latest]
        attempt: [1, 2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Question for #59: does the action install 3.38.5 on Linux arm64?
      - id: action
        continue-on-error: true
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.38.5

      # Fallback: the git checkout of the SDK, which downloads the Dart SDK for the host.
      - if: steps.action.outcome != 'success'
        working-directory: .
        run: |
          git clone --depth 1 --branch 3.38.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >>"$GITHUB_PATH"

      - name: Environment
        run: |
          echo "flutter-action outcome: ${{ steps.action.outcome }}"
          uname -a
          flutter --version

      - run: flutter pub get

      - name: flutter test --tags golden
        run: |
          set -o pipefail
          flutter test --tags golden --reporter expanded 2>&1 | tee "$RUNNER_TEMP/goldens.log"

      - name: Pixel differences
        if: always()
        run: |
          grep -oE "[0-9.]+%, [0-9]+px diff detected" "$RUNNER_TEMP/goldens.log" | sort | uniq -c || echo "No pixel differences reported."

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failures-${{ matrix.runner }}-${{ matrix.attempt }}
          path: mobile/test/**/failures/
          retention-days: 7
